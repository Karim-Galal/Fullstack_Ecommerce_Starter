<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200" role="img">
  <title>Polished silver rings and a chain on a dark surface</title>
  <defs>
    <radialGradient id="hero-bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#2e2d2b" />
      <stop offset="0.52" stop-color="#1a1918" />
      <stop offset="1" stop-color="#0c0c0c" />
    </radialGradient>
    <radialGradient id="hero-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#cfcfcf" stop-opacity="0.07" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hero-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e5e5e" />
      <stop offset="0.16" stop-color="#f1f1f1" />
      <stop offset="0.34" stop-color="#9b9b9b" />
      <stop offset="0.52" stop-color="#ffffff" />
      <stop offset="0.68" stop-color="#8d8d8d" />
      <stop offset="0.84" stop-color="#e8e8e8" />
      <stop offset="1" stop-color="#565656" />
    </linearGradient>
    <linearGradient id="hero-silver-soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a4a" />
      <stop offset="0.3" stop-color="#bdbdbd" />
      <stop offset="0.6" stop-color="#7b7b7b" />
      <stop offset="0.85" stop-color="#d6d6d6" />
      <stop offset="1" stop-color="#444444" />
    </linearGradient>
    <linearGradient id="hero-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.55" />
    </linearGradient>
    <filter id="hero-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="hero-soft-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <rect width="1000" height="1200" fill="url(#hero-bg)" />
  <ellipse cx="500" cy="430" rx="420" ry="400" fill="url(#hero-glow)" />

  <ellipse cx="500" cy="1010" rx="340" ry="72" fill="#000000" opacity="0.55" filter="url(#hero-blur)" />
  <ellipse cx="500" cy="1004" rx="230" ry="40" fill="#3a3936" opacity="0.5" filter="url(#hero-soft-shadow)" />

  <path d="M110 842 C 250 600, 760 588, 908 816" fill="none" stroke="url(#hero-silver-soft)" stroke-width="15" stroke-linecap="round" stroke-dasharray="3 24" opacity="0.85" />
  <path d="M136 884 C 276 648, 736 636, 882 858" fill="none" stroke="url(#hero-silver)" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 30" opacity="0.7" />

  <g transform="rotate(-21 392 664)">
    <ellipse cx="404" cy="676" rx="150" ry="214" fill="none" stroke="#000000" stroke-width="44" opacity="0.55" filter="url(#hero-soft-shadow)" />
    <ellipse cx="392" cy="664" rx="150" ry="214" fill="none" stroke="url(#hero-silver)" stroke-width="36" />
    <ellipse cx="392" cy="664" rx="150" ry="214" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6" stroke-dasharray="88 300" stroke-linecap="round" />
    <ellipse cx="392" cy="664" rx="166" ry="230" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.16" />
  </g>

  <g transform="rotate(17 632 714)">
    <ellipse cx="646" cy="728" rx="128" ry="188" fill="none" stroke="#000000" stroke-width="40" opacity="0.5" filter="url(#hero-soft-shadow)" />
    <ellipse cx="632" cy="714" rx="128" ry="188" fill="none" stroke="url(#hero-silver-soft)" stroke-width="32" />
    <ellipse cx="632" cy="714" rx="128" ry="188" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.5" stroke-dasharray="70 250" stroke-linecap="round" />
  </g>

  <g transform="rotate(-6 552 802)">
    <ellipse cx="562" cy="812" rx="112" ry="160" fill="none" stroke="#000000" stroke-width="34" opacity="0.45" filter="url(#hero-soft-shadow)" />
    <ellipse cx="552" cy="802" rx="112" ry="160" fill="none" stroke="url(#hero-silver)" stroke-width="27" />
    <ellipse cx="552" cy="802" rx="112" ry="160" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5" stroke-dasharray="58 220" stroke-linecap="round" />
  </g>

  <g fill="#ffffff" opacity="0.8">
    <path d="M214 342 l7 22 22 7 -22 7 -7 22 -7 -22 -22 -7 22 -7z" opacity="0.55" />
    <path d="M808 512 l5 16 16 5 -16 5 -5 16 -5 -16 -16 -5 16 -5z" opacity="0.4" />
    <path d="M690 252 l4 13 13 4 -13 4 -4 13 -4 -13 -13 -4 13 -4z" opacity="0.32" />
  </g>

  <rect width="1000" height="1200" fill="url(#hero-shade)" opacity="0.35" />
</svg>
